name: Discovery Check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m app.discovery.runner
      - run: python -m app.cli --self-check
      - name: Validate discovery output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('web/data.json').read_text())
          assert data['engine']['ai'] is False
          assert data['engine']['external_cti'] is False
          assert data['engine']['mode'] == 'zero-seed'
          assert isinstance(data['observations'], list)
          assert all('masked_url' in item for item in data['observations'])
          print('Discovery check records:', len(data['observations']))
          PY
