name: UI Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate web files
        run: |
          test -f web/index.html
          test -f web/style.css
          test -f web/app.js
          test -f web/data.json
          python - <<'PY'
          import json
          from pathlib import Path
          html = Path('web/index.html').read_text(encoding='utf-8')
          css = Path('web/style.css').read_text(encoding='utf-8')
          js = Path('web/app.js').read_text(encoding='utf-8')
          data = json.loads(Path('web/data.json').read_text(encoding='utf-8'))
          assert '<html' in html.lower()
          assert '</html>' in html.lower()
          assert 'stylesheet' in html.lower()
          assert './app.js' in html
          assert len(css.strip()) > 0
          assert 'fetch("./data.json"' in js
          assert set(data['stats']) == {'verified_groups', 'candidates', 'evidence_records', 'observed_sources'}
          print('Static UI validation: OK')
          PY

      - name: Serve website
        run: python -m http.server 4173 --directory web >/tmp/raasfinder-http.log 2>&1 &

      - name: Smoke test website
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen
          time.sleep(1)
          with urlopen('http://127.0.0.1:4173/', timeout=10) as response:
              body = response.read().decode('utf-8', errors='replace')
              assert response.status == 200
              assert 'RaaSFinder' in body
              assert 'Clear Web' in body
              assert 'Forums' in body
              assert 'Onion' in body
          with urlopen('http://127.0.0.1:4173/data.json', timeout=10) as response:
              data = json.loads(response.read().decode('utf-8'))
              assert data['engine']['ai'] is False
              assert data['engine']['external_cti'] is False
          print('UI HTTP smoke test: OK')
          PY

      - name: Upload UI files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: raasfinder-ui-preview
          path: web/
